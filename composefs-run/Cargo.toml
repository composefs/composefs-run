[package]
name = "composefs-run"
description = "Minimal container runner using composefs and crun"
publish = false
edition.workspace = true
license.workspace = true

[[bin]]
name = "cfsrun"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0", default-features = false }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "derive"] }
clap_complete = { version = "4.5", default-features = false, features = ["unstable-dynamic"] }
composefs = { workspace = true }
composefs-fuse = { workspace = true }
composefs-oci = { workspace = true }
oci-spec = { version = "0.10", default-features = false, features = ["runtime"] }
libc = { version = "0.2", default-features = false }
rustix = { version = "1.0.0", default-features = false, features = ["fs", "process", "mount", "pipe"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[dev-dependencies]
rustix = { version = "1.0.0", default-features = false, features = ["process"] }

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
